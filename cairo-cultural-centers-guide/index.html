    /* =========================================
       I18N: Translations
       ========================================= */
    const translations = {
      ar: {
        title: "دليل المراكز الثقافية",
        subtitle: "القاهرة، مصر",
        heroTitle: "اكتشف نبض القاهرة الثقافي",
        heroDesc: "دليلك الشامل للمكتبات، المراكز الفنية، والمعاهد الثقافية في العاصمة.",
        searchPlaceholder: "ابحث بالاسم، المنطقة، أو الكلمات الدالة...",
        filterArea: "المنطقة",
        filterWifi: "خدمة الواي فاي",
        allAreas: "كل المناطق",
        allWifi: "الكل",
        wifiAvailable: "متاح",
        wifiLimited: "محدود",
        wifiNone: "غير متوفر",
        resultsText: "مركز ثقافي",
        clearFilters: "مسح التصفيات",
        emptyTitle: "لا توجد نتائج",
        emptyDesc: "حاول تغيير كلمات البحث أو مسح التصفيات.",
        mapBtn: "الموقع على الخريطة",
        websiteBtn: "الموقع الإلكتروني",
        callBtn: "اتصال",
        emailBtn: "مراسلة",
        workingHoursTitle: "مواعيد العمل",
        addressTitle: "العنوان",
        notAvailable: "غير متوفر",
        footerText: "بني باستخدام",
        detailsLabel: "التفاصيل"
      },
      en: {
        title: "Cultural Centers Guide",
        subtitle: "Cairo, Egypt",
        heroTitle: "Discover Cairo's Cultural Heart",
        heroDesc: "Your comprehensive guide to libraries, art centers, and cultural hubs across the capital.",
        searchPlaceholder: "Search by name, area, or keyword...",
        filterArea: "Neighborhood",
        filterWifi: "Wi-Fi Availability",
        allAreas: "All Areas",
        allWifi: "All",
        wifiAvailable: "Available",
        wifiLimited: "Limited",
        wifiNone: "None",
        resultsText: "Centers Found",
        clearFilters: "Clear Filters",
        emptyTitle: "No results found",
        emptyDesc: "Try adjusting your search terms or clearing filters.",
        mapBtn: "View on Map",
        websiteBtn: "Website",
        callBtn: "Call",
        emailBtn: "Email",
        workingHoursTitle: "Working Hours",
        addressTitle: "Address",
        notAvailable: "N/A",
        footerText: "Built with",
        detailsLabel: "Details"
      }
    };

    /* =========================================
       STATE MANAGEMENT
       ========================================= */
    let currentLang = 'ar';
    let searchQuery = '';
    let selectedArea = '';
    let selectedWifi = '';
    
    // Derived Areas
    const areasAr = [...new Set(rawData.map(c => c.areaAr))].sort();
    const areasEn = [...new Set(rawData.map(c => c.areaEn))].sort();
    
    /* =========================================
       DOM ELEMENTS
       ========================================= */
    const searchInput = document.getElementById('search-input');
    const areaFiltersContainer = document.getElementById('area-filters');
    const wifiFiltersContainer = document.getElementById('wifi-filters');
    const cardsGrid = document.getElementById('cards-grid');
    const resultsCount = document.getElementById('results-count');
    const emptyState = document.getElementById('empty-state');
    const clearFiltersBtn = document.getElementById('clear-filters');
    const langToggleBtn = document.getElementById('lang-toggle');
    const langText = document.getElementById('lang-text');
    
    // Modal
    const detailsModal = document.getElementById('details-modal');
    const modalBackdrop = document.getElementById('modal-backdrop');
    const modalContentPanel = document.getElementById('modal-content-panel');
    const closeModalBtn = document.getElementById('close-modal');
    const modalBody = document.getElementById('modal-body');

    /* =========================================
       FUNCTIONS
       ========================================= */
       
    // Update text elements based on language
    function applyTranslations() {
      const t = translations[currentLang];
      document.title = currentLang === 'ar' ? "دليل المراكز الثقافية في القاهرة | Cairo Cultural Centers" : "Cairo Cultural Centers | دليل المراكز الثقافية";
      document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
      document.documentElement.lang = currentLang;
      langText.textContent = currentLang === 'ar' ? 'English' : 'عربي';
      
      document.getElementById('t-header-title').textContent = t.title;
      document.getElementById('t-header-subtitle').textContent = t.subtitle;
      document.getElementById('t-hero-title').textContent = t.heroTitle;
      document.getElementById('t-hero-desc').textContent = t.heroDesc;
      document.getElementById('t-filter-area').textContent = t.filterArea;
      document.getElementById('t-filter-wifi').textContent = t.filterWifi;
      document.getElementById('t-results-text').textContent = t.resultsText;
      document.getElementById('t-clear-filters').textContent = t.clearFilters;
      document.getElementById('t-empty-title').textContent = t.emptyTitle;
      document.getElementById('t-empty-desc').textContent = t.emptyDesc;
      document.getElementById('t-footer').textContent = t.footerText;
      searchInput.placeholder = t.searchPlaceholder;
      
      renderFilters();
      renderCards();
    }

    // Render Filter Chips
    function renderFilters() {
      const t = translations[currentLang];
      const areas = currentLang === 'ar' ? areasAr : areasEn;
      
      // Area Chips
      areaFiltersContainer.innerHTML = `
        <button onclick="setArea('')" class="px-4 py-2 rounded-full border text-xs transition-all ${selectedArea === '' ? 'chip-active' : 'chip-inactive hover:bg-gray-50'}">
          ${t.allAreas}
        </button>
      `;
      areas.forEach((area, index) => {
        // Find matching generic ID based on En mapping to sync state across languages
        const enArea = areasEn[index];
        const isActive = selectedArea === enArea;
        
        areaFiltersContainer.innerHTML += `
          <button onclick="setArea('${enArea}')" class="px-4 py-2 rounded-full border text-xs transition-all ${isActive ? 'chip-active' : 'chip-inactive hover:bg-gray-50'}">
            ${area}
          </button>
        `;
      });

      // Wi-Fi Chips
      const wifiOptions = [
        { val: '', label: t.allWifi },
        { val: 'available', label: t.wifiAvailable },
        { val: 'limited', label: t.wifiLimited },
        { val: 'none', label: t.wifiNone }
      ];

      wifiFiltersContainer.innerHTML = '';
      wifiOptions.forEach(opt => {
        const isActive = selectedWifi === opt.val;
        wifiFiltersContainer.innerHTML += `
          <button onclick="setWifi('${opt.val}')" class="px-4 py-2 rounded-full border text-xs transition-all ${isActive ? 'chip-active' : 'chip-inactive hover:bg-gray-50'}">
            ${opt.label}
          </button>
        `;
      });
      
      toggleClearFiltersBtn();
    }

    // Handlers for Filters
    window.setArea = (area) => {
      selectedArea = area;
      renderFilters();
      renderCards();
    }
    window.setWifi = (wifi) => {
      selectedWifi = wifi;
      renderFilters();
      renderCards();
    }
    
    function toggleClearFiltersBtn() {
      if (searchQuery || selectedArea || selectedWifi) {
        clearFiltersBtn.classList.remove('hidden');
      } else {
        clearFiltersBtn.classList.add('hidden');
      }
    }

    function clearFilters() {
      searchQuery = '';
      searchInput.value = '';
      selectedArea = '';
      selectedWifi = '';
      renderFilters();
      renderCards();
    }

    // Helper: Wifi Badge
    function getWifiBadge(status) {
      const t = translations[currentLang];
      if (status === 'available') return `<span class="text-[#10b981] text-[10px] font-bold flex items-center gap-1"><i data-lucide="wifi" class="w-3 h-3"></i> ${t.wifiAvailable}</span>`;
      if (status === 'limited') return `<span class="text-yellow-600 text-[10px] font-bold flex items-center gap-1"><i data-lucide="signal-low" class="w-3 h-3"></i> ${t.wifiLimited}</span>`;
      return `<span class="text-gray-400 text-[10px] font-bold flex items-center gap-1"><i data-lucide="wifi-off" class="w-3 h-3"></i> ${t.wifiNone}</span>`;
    }

    // Render Cards Grid
    function renderCards() {
      const t = translations[currentLang];
      
      const filtered = rawData.filter(c => {
        const term = searchQuery.toLowerCase();
        const searchMatch = c.nameAr.toLowerCase().includes(term) || 
                            c.nameEn.toLowerCase().includes(term) ||
                            c.addressAr.toLowerCase().includes(term) ||
                            c.addressEn.toLowerCase().includes(term);
        const areaMatch = selectedArea ? c.areaEn === selectedArea : true;
        const wifiMatch = selectedWifi ? c.wifi === selectedWifi : true;
        return searchMatch && areaMatch && wifiMatch;
      });

      resultsCount.textContent = filtered.length;
      
      if (filtered.length === 0) {
        cardsGrid.innerHTML = '';
        emptyState.classList.remove('hidden');
      } else {
        emptyState.classList.add('hidden');
        cardsGrid.innerHTML = filtered.map((c, index) => {
          const name = currentLang === 'ar' ? c.nameAr : c.nameEn;
          const subtitle = currentLang === 'ar' ? c.nameEn : c.nameAr;
          const address = currentLang === 'ar' ? c.addressAr : c.addressEn;
          const area = currentLang === 'ar' ? c.areaAr : c.areaEn;
          const days = currentLang === 'ar' ? c.workingDaysAr : c.workingDaysEn;

          return `
            <div class="glass-card p-6 flex flex-col justify-between h-full fade-in cursor-pointer relative group" style="animation-delay: ${index * 0.05}s;" onclick="openModal(${c.id})">
              
              <div>
                <div class="flex justify-between items-start mb-4">
                  <span class="bg-[#fef3c7] text-[#b45309] px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider">${area}</span>
                  ${getWifiBadge(c.wifi)}
                </div>
                
                <h3 class="text-2xl font-bold text-[#1a1a1a] leading-tight mb-1">${name}</h3>
                <p class="text-sm text-[#b45309] font-serif mb-4">${subtitle}</p>
                
                <div class="grid grid-cols-2 gap-4 text-xs mb-4 pt-2 border-t border-[#e5e1da]">
                  <div>
                    <p class="text-gray-400 uppercase font-bold tracking-tighter mb-1">${t.addressTitle}</p>
                    <p class="font-semibold text-gray-700 line-clamp-2">${address}</p>
                  </div>
                  <div>
                    <p class="text-gray-400 uppercase font-bold tracking-tighter mb-1">${t.workingHoursTitle}</p>
                    <p class="font-semibold text-gray-700">${c.workingHours}</p>
                  </div>
                </div>
              </div>

              <div class="mt-auto pt-4 flex gap-2">
                <button class="flex-1 py-3 bg-[#1a1a1a] text-white rounded-xl text-xs font-bold transition-all group-hover:bg-[#b45309]">${t.detailsLabel}</button>
                <button class="px-4 py-3 border border-[#d1ccc0] rounded-xl text-[#1a1a1a] text-xs font-bold group-hover:border-[#1a1a1a] transition-all"><i data-lucide="arrow-${currentLang === 'ar' ? 'left' : 'right'}" class="w-4 h-4"></i></button>
              </div>
            </div>
          `;
        }).join('');
      }
      
      lucide.createIcons();
      toggleClearFiltersBtn();
    }

    // Modal Logic
    window.openModal = (id) => {
      const c = rawData.find(item => item.id === id);
      if (!c) return;
      
      const t = translations[currentLang];
      const name = currentLang === 'ar' ? c.nameAr : c.nameEn;
      const subtitle = currentLang === 'ar' ? c.nameEn : c.nameAr;
      const address = currentLang === 'ar' ? c.addressAr : c.addressEn;
      const area = currentLang === 'ar' ? c.areaAr : c.areaEn;
      const days = currentLang === 'ar' ? c.workingDaysAr : c.workingDaysEn;

      // Action Button Helper
      const getActionBtn = (url, icon, label, type = 'primary') => {
        if (!url) {
          return `
            <div class="flex-1 py-3 bg-gray-50 text-gray-400 rounded-xl text-xs font-bold border border-[#e5e1da] flex flex-col items-center gap-1 cursor-not-allowed">
              <i data-lucide="${icon}-off" class="w-4 h-4 opacity-50"></i>
              <span>${label}</span>
            </div>
          `;
        }
        
        const baseClass = "flex-1 py-3 rounded-xl text-xs font-bold flex flex-col items-center gap-1 transition-all active:scale-95";
        const styleClass = type === 'primary' 
          ? "bg-[#1a1a1a] text-white hover:bg-[#b45309]" 
          : "bg-white text-[#1a1a1a] border border-[#d1ccc0] hover:border-[#1a1a1a]";

        return `
          <a href="${url}" target="_blank" rel="noopener noreferrer" class="${baseClass} ${styleClass}">
            <i data-lucide="${icon}" class="w-4 h-4"></i>
            <span>${label}</span>
          </a>
        `;
      };
      
      const getSocialBtn = (url, icon) => {
        if (!url) return '';
        return `
          <a href="${url}" target="_blank" rel="noopener noreferrer" class="text-[10px] font-bold text-[#b45309] hover:text-[#92400e] flex items-center gap-1">
            <i data-lucide="${icon}" class="w-3 h-3"></i>
            <span class="capitalize">${icon}</span>
          </a>
        `;
      };

      const socialHTML = (c.facebook || c.instagram) 
        ? `<div class="mt-4 flex gap-4 pt-4 border-t border-[#e5e1da]">
             ${getSocialBtn(c.facebook, 'facebook')}
             ${getSocialBtn(c.instagram, 'instagram')}
           </div>` 
        : '';

      modalBody.innerHTML = `
        <div class="mb-6 border-b border-[#e5e1da] pb-6">
          <div class="flex justify-between items-start mb-4">
            <span class="bg-[#fef3c7] text-[#b45309] px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider">${area}</span>
            ${getWifiBadge(c.wifi)}
          </div>
          <h2 class="text-3xl font-bold text-[#1a1a1a] mb-1">${name}</h2>
          <p class="text-lg text-[#b45309] font-serif">${subtitle}</p>
        </div>

        <div class="flex gap-2 mb-6">
          ${getActionBtn(c.mapsLink, 'map-pin', t.mapBtn, 'primary')}
          ${getActionBtn(c.website, 'globe', t.websiteBtn, 'secondary')}
          ${getActionBtn(c.phone ? 'tel:' + c.phone : '', 'phone', t.callBtn, 'secondary')}
          ${getActionBtn(c.email ? 'mailto:' + c.email : '', 'mail', t.emailBtn, 'secondary')}
        </div>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="bg-[#f8f5f2] p-5 rounded-2xl border border-[#e5e1da]">
            <p class="text-gray-400 uppercase font-bold tracking-tighter mb-1 text-xs">${t.workingHoursTitle}</p>
            <p class="font-semibold text-gray-700 text-sm mb-1">${days}</p>
            <p class="font-bold text-[#1a1a1a]">${c.workingHours}</p>
          </div>
          
          <div class="bg-[#f8f5f2] p-5 rounded-2xl border border-[#e5e1da]">
            <p class="text-gray-400 uppercase font-bold tracking-tighter mb-1 text-xs">${t.addressTitle}</p>
            <p class="font-semibold text-gray-700 text-sm leading-relaxed">${address}</p>
          </div>
        </div>

        ${socialHTML}
      `;

      lucide.createIcons();
      
      // Show Modal
      document.body.style.overflow = 'hidden';
      detailsModal.classList.remove('opacity-0', 'pointer-events-none');
      modalContentPanel.classList.remove('scale-95');
      modalContentPanel.classList.add('scale-100');
    }

    function closeModal() {
      document.body.style.overflow = '';
      detailsModal.classList.add('opacity-0', 'pointer-events-none');
      modalContentPanel.classList.add('scale-95');
      modalContentPanel.classList.remove('scale-100');
    }

    /* =========================================
       EVENT LISTENERS & INIT
       ========================================= */
    document.addEventListener('DOMContentLoaded', () => {
      // Init UI
      applyTranslations();
      
      // Search Input
      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        renderCards();
      });

      // Clear Filters
      clearFiltersBtn.addEventListener('click', clearFilters);

      // Language Toggle
      langToggleBtn.addEventListener('click', () => {
        currentLang = currentLang === 'ar' ? 'en' : 'ar';
        applyTranslations();
      });

      // Modal Triggers
      closeModalBtn.addEventListener('click', closeModal);
      modalBackdrop.addEventListener('click', closeModal);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeModal();
      });
    });
  </script>
